<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#090b22"><title>ITONOVA</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08091d;color:white;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(155deg,#090a24d9,#2c0846d9);text-align:center;padding:25px}#panel{max-width:420px}h1{font-size:clamp(42px,12vw,72px);margin:0;color:#ffda6b;text-shadow:0 0 20px #fb3ba8;letter-spacing:3px}p{line-height:1.8}button{border:0;border-radius:30px;padding:17px 42px;background:linear-gradient(90deg,#ff4ca8,#ffca63);font-size:19px;font-weight:900;color:#24122e;box-shadow:0 0 28px #ff4ca888}small{color:#c9c4e5}#hud{position:fixed;top:env(safe-area-inset-top);left:0;right:0;padding:15px 18px;display:flex;justify-content:space-between;font-weight:800;text-shadow:0 2px 5px #000;pointer-events:none}#hud[hidden],#overlay[hidden]{display:none}</style></head><body><canvas id="game"></canvas><div id="hud" hidden><span id="score">SCORE 0</span><span id="best">BEST 0</span></div><div id="overlay"><div id="panel"><h1>ITONOVA</h1><p>ネオ昭和 × スペースEDM<br>押し続けると上昇、離すと落下。<br>上下の壁のすき間をくぐり抜けよう！</p><button id="start">ゲームスタート ▶</button><p><small>音が鳴ります / iPhoneは画面を長押しして操作</small></p></div></div><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),panel=document.getElementById('panel'),hud=document.getElementById('hud'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');let W=0,H=0,dpr=1,mode='title',press=false,player,obstacles=[],particles=[],score=0,passed=0,best=0,elapsed=0,spawn=0,speed=0,last=0,raf=0,audio=null,beatTimer=0,beat=0;try{best=+(localStorage.getItem('itonova-best')||0)}catch(e){};function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();const rand=(a,b)=>a+Math.random()*(b-a);function initAudio(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){audio=null}}function tone(freq,dur,type='sine',vol=.07,delay=0){if(!audio)return;const t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(vol,.001),t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+dur+.02)}function noise(dur=.45){if(!audio)return;const len=Math.ceil(audio.sampleRate*dur),b=audio.createBuffer(1,len,audio.sampleRate),a=b.getChannelData(0);for(let i=0;i<len;i++)a[i]=(Math.random()*2-1)*(1-i/len);const s=audio.createBufferSource(),g=audio.createGain(),f=audio.createBiquadFilter();s.buffer=b;f.type='lowpass';f.frequency.value=750;g.gain.value=.26;s.connect(f).connect(g).connect(audio.destination);s.start()}function musicStep(){if(mode!=='play')return;const bass=[110,110,146.83,110,164.81,146.83,98,123.47],note=bass[Math.floor(beat/2)%8];if(beat%2===0){tone(note,.18,'sawtooth',.055);tone(55,.13,'sine',.16)}if(beat%2===1)tone(950,.045,'triangle',.022);if(beat%4===2)tone(190,.09,'square',.032);if(beat%8===0)tone(note*4,.12,'triangle',.035);beat++}function startMusic(){stopMusic();beat=0;musicStep();beatTimer=setInterval(musicStep,235)}function stopMusic(){clearInterval(beatTimer);beatTimer=0}function reset(){player={x:W*.23,y:H*.5,vy:0,r:Math.max(8,Math.min(12,W*.024))};obstacles=[];particles=[];score=0;passed=0;elapsed=0;spawn=.9;speed=Math.min(195,Math.max(145,W*.42));press=false;mode='play';overlay.hidden=true;hud.hidden=false;updateHUD();startMusic();last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}function updateHUD(){scoreEl.textContent='SCORE '+score;bestEl.textContent='BEST '+best}function addObstacle(){const gap=Math.max(145,Math.min(H*.43,230)-Math.min(passed*1.2,48)),margin=42,center=rand(margin+gap/2,H-margin-gap/2);obstacles.push({x:W+30,w:Math.max(58,Math.min(88,W*.19)),center,gap,done:false})}function burst(x,y,n=24){for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),v=rand(60,270);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(.3,.8),max:.8})}}function die(){mode='over';press=false;stopMusic();noise();tone(75,.42,'sawtooth',.15);burst(player.x,player.y,36);if(score>best){best=score;try{localStorage.setItem('itonova-best',best)}catch(e){}}updateHUD();panel.innerHTML='<h1>GAME OVER</h1><p>スコア <b>'+score+'</b>　/　ベスト <b>'+best+'</b></p><button id="start">もう一回 ▶</button><p><small>押すと上昇・離すと落下</small></p>';overlay.hidden=false;document.getElementById('start').addEventListener('click',()=>{initAudio();reset()})}function update(dt){elapsed+=dt;speed=Math.min(285,speed+dt*1.4);const scale=Math.max(.75,Math.min(1.2,H/750));const acceleration=(press?-410:650)*scale;player.vy=Math.max(-205*scale,Math.min(270*scale,player.vy+acceleration*dt));player.y+=player.vy*dt;spawn-=dt;if(spawn<=0){addObstacle();spawn=Math.max(1.05,1.55-passed*.009)}for(const o of obstacles){o.x-=speed*dt;if(!o.done&&o.x+o.w<player.x-player.r){o.done=true;passed++;score+=100;tone(660,.075,'triangle',.065);tone(880,.11,'triangle',.035,.06);updateHUD()}if(player.x+player.r>o.x&&player.x-player.r<o.x+o.w){const top=o.center-o.gap/2,bottom=o.center+o.gap/2;if(player.y-player.r<top||player.y+player.r>bottom){die();return}}}obstacles=obstacles.filter(o=>o.x+o.w>-40);if(player.y-player.r<0||player.y+player.r>H){die();return}for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0)}function draw(t){const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0b1033');bg.addColorStop(.55,'#25134c');bg.addColorStop(1,'#070a20');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);for(let i=0;i<52;i++){const x=((i*127.7-t*.016*(i%3+1))%(W+30)+W+30)%(W+30),y=(i*83.13)%H;ctx.fillStyle=i%3?'#d9cfff88':'#ffe7a6';ctx.fillRect(x,y,1.5,1.5)}ctx.save();ctx.globalAlpha=.35;ctx.strokeStyle='#fe52ac';ctx.lineWidth=1;const offset=(t*.03)%45;for(let y=H*.6+offset;y<H;y+=45){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.restore();for(const o of obstacles){const top=o.center-o.gap/2,bottom=o.center+o.gap/2;ctx.shadowColor='#ff3c9d';ctx.shadowBlur=16;ctx.fillStyle='#33184e';ctx.fillRect(o.x,0,o.w,top);ctx.fillRect(o.x,bottom,o.w,H-bottom);ctx.shadowBlur=0;ctx.fillStyle='#ff58aa';ctx.fillRect(o.x,top-5,o.w,5);ctx.fillRect(o.x,bottom,o.w,5);ctx.fillStyle='#7c4d9b';for(let y=12;y<top-15;y+=32)ctx.fillRect(o.x+10,y,o.w-20,2);for(let y=bottom+18;y<H;y+=32)ctx.fillRect(o.x+10,y,o.w-20,2)}if(player&&mode!=='title'){ctx.save();ctx.translate(player.x,player.y);ctx.rotate(Math.max(-.45,Math.min(.6,player.vy/400)));ctx.shadowColor='#66faff';ctx.shadowBlur=22;ctx.fillStyle='#66faff';ctx.beginPath();ctx.moveTo(18,0);ctx.lineTo(-13,-10);ctx.lineTo(-8,0);ctx.lineTo(-13,10);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff3a5';ctx.fillRect(-4,-3,8,6);ctx.fillStyle='#ffae4c';ctx.beginPath();ctx.moveTo(-13,-4);ctx.lineTo(-13-rand(5,15),0);ctx.lineTo(-13,4);ctx.fill();ctx.restore()}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle='#ffb95d';ctx.fillRect(p.x,p.y,4,4)}ctx.globalAlpha=1}function loop(t){const dt=Math.min(.035,(t-last)/1000||.016);last=t;if(mode==='play')update(dt);draw(t);if(mode==='play')raf=requestAnimationFrame(loop)}function pointerDown(e){if(mode!=='play')return;e.preventDefault();press=true}function pointerUp(e){press=false}canvas.addEventListener('pointerdown',pointerDown);addEventListener('pointerup',pointerUp);addEventListener('pointercancel',pointerUp);addEventListener('blur',()=>{press=false});document.addEventListener('visibilitychange',()=>{if(document.hidden){press=false;if(audio)audio.suspend()}else if(audio&&mode==='play')audio.resume()});document.getElementById('start').addEventListener('click',()=>{initAudio();reset()});draw(0)})();
</script></body></html>
