<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101b3b"><title>イトノヴァ ITONOVA Ver.5</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090e29;color:#fff1bc;font-family:ui-monospace,'Courier New',monospace;touch-action:none}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}#hud{position:fixed;top:env(safe-area-inset-top);left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:12px 15px;font-weight:900;font-size:15px;color:#fff0b3;text-shadow:2px 2px #242449;pointer-events:none;background:linear-gradient(#101a3ddc,#101a3d00)}[hidden]{display:none!important}#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 14px) 17px calc(env(safe-area-inset-bottom) + 14px);background:#1017335c}#panel{width:min(100%,420px);max-height:100%;overflow:auto;text-align:center;background:#111d42ed;border:5px solid #ffe4a4;outline:3px solid #ef78a2;box-shadow:0 0 0 7px #18274d,8px 10px 0 #080e29;padding:17px 12px 16px}h1{font-size:clamp(34px,11vw,58px);line-height:1.15;letter-spacing:-3px;color:#ffb5a5;text-shadow:3px 3px #f04d9b,6px 6px #255e99;margin:7px 0 0;font-weight:1000}h2{margin:8px 0;color:#ffb9bb;font-size:23px}p{font-size:13px;line-height:1.8;margin:12px 0}.sub{font-size:14px;letter-spacing:4px;color:#fff0bb;margin-bottom:16px}.button{display:block;width:min(92%,295px);margin:9px auto;padding:13px 8px;border:3px solid #ffe8b2;border-radius:0;background:#ec649b;color:#fff8c9;font-size:17px;font-weight:900;box-shadow:4px 4px 0 #142c5d;cursor:pointer;font-family:inherit}.button.alt{background:#193564}.button:active{transform:translate(3px,3px);box-shadow:1px 1px #142c5d}.scores{max-height:40vh;overflow:auto;text-align:left;margin:10px 0;background:#0c1735;padding:8px}.scores div{display:flex;justify-content:space-between;gap:10px;padding:6px 3px;border-bottom:1px solid #7da0bc55;font-size:12px}.scores b{color:#ffe3a0}.small{font-size:11px;color:#c5cbe0}.face{display:inline-block;position:relative;width:62px;height:55px;margin:6px auto 0;background:#182447;border:4px solid #ffe3a6;clip-path:polygon(17% 15%,36% 0,48% 14%,69% 0,81% 23%,100% 32%,95% 82%,68% 100%,22% 100%,0 72%,0 33%)}.face:before{content:'';position:absolute;left:16px;top:21px;width:27px;height:22px;background:#ffe4bb;box-shadow:4px 0 #ffe4bb}.face:after{content:'••';position:absolute;top:22px;left:21px;color:#111a39;letter-spacing:5px;font-size:15px}

/* The title is a compact, hand-pixeled arcade scene rather than a modal card. */
body.title-mode #overlay{align-items:flex-end;background:transparent;pointer-events:none;padding:0 18px calc(env(safe-area-inset-bottom) + 18px)}
body.title-mode #panel{pointer-events:auto;background:#111b3bdc;border:3px solid #ffe5ad;outline:2px solid #ec83a5;box-shadow:5px 6px 0 #080e29;padding:12px 10px;max-height:55vh;overflow:auto;width:min(100%,370px)}
body.title-mode h1,body.title-mode .sub,body.title-mode .face{display:none}
body.title-mode .button{padding:10px 8px;margin:7px auto;font-size:16px}
body.title-mode .small{margin:6px 0 0;line-height:1.5}
</style></head><body><canvas id="game"></canvas><div id="hud" hidden><span id="score">SCORE 0000</span><span id="best">BEST 0000</span></div><div id="overlay"><div id="panel"></div></div><script>
(()=>{'use strict';const c=document.querySelector('canvas'),g=c.getContext('2d',{alpha:false}),overlay=document.getElementById('overlay'),panel=document.getElementById('panel'),hud=document.getElementById('hud'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');const VW=360,VH=640;let mode='title',down=false,hero={x:78,y:320,vy:0,r:11},walls=[],sparks=[],score=0,passed=0,best=0,spawn=1,spd=112,elapsed=0,prev=0,raf=0,rank=[],audio=null,musicId=null,step=0,soundOn=true,clock=0,deathAt=0,deathX=0,deathY=0;const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));try{rank=JSON.parse(localStorage.getItem('itonova-scores-100')||'[]');if(!Array.isArray(rank))rank=[];rank=rank.filter(x=>Number.isFinite(x.score)).slice(0,100);best=Number(localStorage.getItem('itonova-best')||0)}catch(e){rank=[]}function resize(){const d=Math.min(devicePixelRatio||1,2);c.width=Math.round(VW*d);c.height=Math.round(VH*d);g.setTransform(d,0,0,d,0,0);g.imageSmoothingEnabled=false}resize();addEventListener('resize',resize);
function audioInit(){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){audio=null}}function synth(f,d,type='square',vol=.045,when=0,slide=null){if(!audio||!soundOn)return;const t=audio.currentTime+when,o=audio.createOscillator(),a=audio.createGain();o.type=type;o.frequency.setValueAtTime(Math.max(20,f),t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+d);a.gain.setValueAtTime(.0001,t);a.gain.exponentialRampToValueAtTime(vol,t+.008);a.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(a).connect(audio.destination);o.start(t);o.stop(t+d+.01)}function hiss(d=.07,vol=.055,low=7000){if(!audio||!soundOn)return;const len=Math.round(audio.sampleRate*d),b=audio.createBuffer(1,len,audio.sampleRate),a=b.getChannelData(0);for(let i=0;i<len;i++)a[i]=Math.random()*2-1;const src=audio.createBufferSource(),filter=audio.createBiquadFilter(),gain=audio.createGain();src.buffer=b;filter.type='highpass';filter.frequency.value=low;gain.gain.setValueAtTime(vol,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);src.connect(filter).connect(gain).connect(audio.destination);src.start()}function beatTick(){if(mode!=='play'||!soundOn)return;const s=step%16,roots=[110,87.31,130.81,98],root=roots[Math.floor(step/16)%4];if(s%4===0){synth(135,.18,'sine',.27,0,45);synth(52,.11,'triangle',.13)}if(s===4||s===12){hiss(.13,.105,1500);synth(180,.09,'triangle',.045)}if(s%2===0)hiss(.055,.045,5500);else hiss(.025,.022,8500);if(s%2===0){const bass=[0,0,7,0,12,7,3,7][s/2];synth(root*Math.pow(2,bass/12),.19,'sawtooth',.057)}if(s===0||s===8){[root*2,root*2.5,root*3].forEach(f=>synth(f,.32,'triangle',.015))}if(s===2||s===6||s===10||s===14)synth(root*4*Math.pow(2,([7,12,10,7][(s-2)/4])/12),.095,'square',.018);step++}function musicStart(){musicStop();if(!soundOn)return;audioInit();step=0;beatTick();musicId=setInterval(beatTick,125)}function musicStop(){if(musicId!==null)clearInterval(musicId);musicId=null}
let titleStep=0;
function titleTick(){
 if(mode!=='title'||!soundOn||!audio||audio.state!=='running')return;
 const n=titleStep++%16, notes=[392,493.88,587.33,783.99,587.33,493.88,440,349.23];
 if(n%2===0)synth(notes[(n/2)%8],.19,'triangle',.026);
 if(n%4===0)synth([98,110,87.31,130.81][Math.floor(titleStep/16)%4],.35,'sine',.032);
 if(n===7||n===15)synth(1174.66,.24,'sine',.013);
}
function titleMusicStart(){
 musicStop();if(!soundOn||!audio||audio.state!=='running')return;
 titleStep=0;titleTick();musicId=setInterval(titleTick,210);
}
function ping(){synth(660,.1,'square',.045);synth(990,.15,'triangle',.035,.08)}function boom(){hiss(.36,.18,450);synth(150,.42,'sawtooth',.15,0,35)}
function stars(){for(let i=0;i<67;i++){let x=((i*83+clock*(.005+(i%3)*.009))%VW+VW)%VW,y=(i*137+17)%VH;g.fillStyle=i%4===0?'#ffda86':i%3===0?'#82b7dc':'#d4c9ce';g.fillRect(Math.floor(x),y,i%6===0?3:2,i%6===0?3:2);if(i%10===0){g.fillRect(Math.floor(x)-3,y+1,9,1);g.fillRect(Math.floor(x)+1,y-3,1,9)}}}function pixelRect(x,y,w,h,color){g.fillStyle=color;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}function bg(){pixelRect(0,0,VW,VH,'#0d1a3e');pixelRect(0,385,VW,255,'#11244a');stars();g.fillStyle='#e97b9e';g.beginPath();g.arc(288,140,48,0,Math.PI*2);g.fill();g.fillStyle='#b55d9b';for(let i=0;i<8;i++)pixelRect(250,113+i*8,76,3,'#b55d9b');g.strokeStyle='#f8d18b';g.lineWidth=6;g.beginPath();g.ellipse(288,140,75,18,-.25,0,Math.PI*2);g.stroke();g.strokeStyle='#6f9abf';g.lineWidth=2;g.beginPath();g.ellipse(288,140,75,18,-.25,0,Math.PI*2);g.stroke();const offset=(clock*.012)%75;for(let i=-1;i<8;i++){const x=i*75-offset,h=30+((i*17)%65);pixelRect(x,475-h,37,h,'#a75e9b');pixelRect(x+5,475-h+8,8,5,'#f8d8a4');pixelRect(x+21,475-h+22,8,5,'#f8d8a4');pixelRect(x+3,475-h-8,30,8,'#ed9aa3')}pixelRect(0,476,VW,164,'#172a51');for(let y=490;y<640;y+=17){pixelRect(0,y,VW,2,y%34===0?'#31507a':'#233b63')}for(let i=0;i<10;i++)pixelRect(i*42-(clock*.02%42),484+((i*19)%125),20,3,'#e58ba4')}
function wallDraw(o){const x=Math.floor(o.x),w=Math.ceil(o.w),top=Math.floor(o.mid-o.gap/2),bot=Math.ceil(o.mid+o.gap/2);for(const [y,h,edge] of [[0,top,top-11],[bot,VH-bot,bot]]){pixelRect(x-3,y,w+6,h,'#f5d6a2');pixelRect(x,y,w,h,'#e989a8');pixelRect(x+6,y,w-12,h,'#ba6a9d');pixelRect(x+10,y,w-20,h,'#e89caf');for(let j=y+12;j<y+h-12;j+=35){pixelRect(x+13,j,w-26,4,'#4c5d92');pixelRect(x+17,j+9,7,7,'#fff0b8');pixelRect(x+w-25,j+9,7,7,'#78b3d0')}pixelRect(x-5,edge,w+10,10,'#ffe2a1');pixelRect(x-3,edge+2,w+6,5,'#f47ca2');pixelRect(x+6,edge+3,w-12,2,'#e6c0b7')}}function heroDraw(x,y,vy){g.save();g.translate(Math.round(x),Math.round(y));g.rotate(clamp(vy/520,-.2,.27));const flame=7+(Math.sin(clock*.06)*4|0);pixelRect(-24,-3,flame+7,6,'#74c6db');pixelRect(-22-flame,-2,flame,4,'#f5d99b');pixelRect(-10,9,16,4,'#f05d91');pixelRect(-8,12,19,4,'#e95e89');pixelRect(-12,-9,23,23,'#ffe1a7');pixelRect(-13,-13,25,16,'#19264b');pixelRect(-9,-18,12,8,'#19264b');pixelRect(-2,-21,9,11,'#19264b');pixelRect(9,-11,7,9,'#19264b');pixelRect(-8,-1,20,15,'#f7d6af');pixelRect(2,0,3,6,'#17254b');pixelRect(10,1,3,6,'#17254b');pixelRect(-13,-4,7,10,'#f36d9b');pixelRect(-11,-2,4,6,'#76bad3');pixelRect(-5,14,16,6,'#d8e9e1');pixelRect(0,17,7,3,'#f16d93');g.restore()}
function titleArt(){
  // Large, simple 8-bit title mark and tiny hand-placed star sprites.
  g.save();g.textAlign='center';g.lineJoin='round';g.font='bold 49px sans-serif';
  g.lineWidth=8;g.strokeStyle='#14274f';g.strokeText('イトノヴァ',VW/2,126);
  g.fillStyle='#f26c9c';g.fillText('イトノヴァ',VW/2+2,130);
  g.fillStyle='#ffe6aa';g.fillText('イトノヴァ',VW/2,125);
  g.font='bold 19px monospace';g.fillStyle='#fff1bd';g.fillText('I T O N O V A',VW/2,158);
  g.strokeStyle='#f5a4ad';g.lineWidth=5;g.beginPath();g.ellipse(180,111,162,43,-.27,Math.PI*.13,Math.PI*1.85);g.stroke();
  // The hero is enlarged on the title scene, with chunky, unfiltered pixels.
  g.translate(80,282+Math.sin(clock*.002)*5);g.scale(2.5,2.5);g.translate(-80,-282);heroDraw(80,282,0);
  g.restore();
  pixelRect(14,365,332,3,'#f7d6a5');pixelRect(28,374,304,2,'#ee86a5');
}
function render(){bg();for(const o of walls)wallDraw(o);if(mode==='play')heroDraw(hero.x,hero.y,hero.vy);else if(mode==='title')titleArt();for(const p of sparks){g.globalAlpha=clamp(p.life/p.max,0,1);pixelRect(p.x,p.y,p.size,p.size,p.color)}
if(mode==='over'){
  const age=Math.min(1.4,(performance.now()-deathAt)/1000), radius=age*92;
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4+age*.45,x=deathX+Math.cos(a)*radius,y=deathY+Math.sin(a)*radius;
    g.globalAlpha=Math.max(0,1-age/1.4);
    pixelRect(x-8,y-8,16,16,'#ffe6ac');pixelRect(x-5,y-5,10,10,i%2?'#f06d9b':'#81c8e0');
    pixelRect(x-2,y-2,4,4,'#fff4c9');
  }
  g.globalAlpha=1;
}g.globalAlpha=1;for(let y=0;y<VH;y+=4)pixelRect(0,y,VW,1,'#0b12301a');pixelRect(0,0,VW,6,'#ffdaaa');pixelRect(0,VH-6,VW,6,'#ffdaaa');pixelRect(0,0,5,VH,'#ffdaaa');pixelRect(VW-5,0,5,VH,'#ffdaaa')}
function scoresHTML(){return '<div class="scores">'+(rank.length?rank.map((r,i)=>'<div><span>'+(i+1)+'位</span><b>'+r.score+'</b><span>'+r.date+'</span></div>').join(''):'まだスコアがないよ！')+'</div>'}function title(lastScore=null){mode='title';document.body.classList.add('title-mode');titleMusicStart();hud.hidden=true;overlay.hidden=false;panel.innerHTML=''+(lastScore===null?'':'<p>GAME OVER 💥<br>今回 '+lastScore+' 点　最高 '+best+' 点</p>')+'<button class="button" id="start">▶ スタート</button><button class="button alt" id="ranking">♛ ランキング</button><button class="button alt" id="sound">♪ サウンド '+(soundOn?'ON':'OFF')+'</button><p class="small">押すと上昇・離すと落下<br>宇宙基地のすき間を通り抜けよう！<br>ITONOVA Ver.5<br>♪ タイトルBGMは画面タップで開始</p>';document.getElementById('start').onclick=reset;document.getElementById('ranking').onclick=()=>{panel.innerHTML='<h2>♛ ランキング</h2><p class="small">このiPhoneに保存した上位100件</p>'+scoresHTML()+'<button class="button alt" id="back">タイトルへ</button>';document.getElementById('back').onclick=()=>title(lastScore)};document.getElementById('sound').onclick=()=>{soundOn=!soundOn;if(soundOn)audioInit();musicStop();title(lastScore)}}function reset(){document.body.classList.remove('title-mode');audioInit();hero={x:78,y:310,vy:0,r:11};walls=[];sparks=[];score=0;passed=0;elapsed=0;spawn=1.25;spd=112;down=false;mode='play';overlay.hidden=true;hud.hidden=false;hudUpdate();musicStart();prev=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}function hudUpdate(){scoreEl.textContent='SCORE '+String(score).padStart(4,'0');bestEl.textContent='BEST '+String(best).padStart(4,'0')}function newWall(){const gap=Math.max(133,211-passed*1.15),half=gap/2,center=clamp(320+Math.sin(passed*1.6)*100+rnd(-30,30),half+52,VH-half-52);walls.push({x:VW+10,w:58,mid:center,gap,done:false})}function explode(){for(let i=0;i<36;i++){const a=rnd(0,6.28),v=rnd(55,220);sparks.push({x:hero.x,y:hero.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.3,.8),max:.8,size:rnd(3,8),color:i%2?'#ffe2a3':'#ef7ba4'})}}function die(){if(mode!=='play')return;mode='over';deathAt=performance.now();deathX=hero.x;deathY=hero.y;down=false;musicStop();boom();explode();rank.push({score,date:new Date().toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'})});rank.sort((a,b)=>b.score-a.score);rank=rank.slice(0,100);best=Math.max(score,best);try{localStorage.setItem('itonova-best',String(best));localStorage.setItem('itonova-scores-100',JSON.stringify(rank))}catch(e){}hudUpdate();setTimeout(()=>{if(mode==='over')title(score)},1450)}function update(dt){elapsed+=dt;spd=Math.min(174,112+elapsed*.48);hero.vy=clamp(hero.vy+(down?-345:505)*dt,-137,205);hero.y+=hero.vy*dt;spawn-=dt;if(spawn<=0){newWall();spawn=Math.max(1.35,1.93-passed*.008)}for(const o of walls){o.x-=spd*dt;if(!o.done&&o.x+o.w<hero.x-hero.r){o.done=true;passed++;score+=100;ping();hudUpdate()}if(hero.x+hero.r-3>o.x&&hero.x-hero.r+3<o.x+o.w){if(hero.y-hero.r+3<o.mid-o.gap/2||hero.y+hero.r-3>o.mid+o.gap/2){die();return}}}walls=walls.filter(o=>o.x+o.w>-10);if(hero.y-hero.r<6||hero.y+hero.r>VH-6)die()}function loop(t){const dt=Math.min(.035,(t-prev)/1000||.016);prev=t;clock=t;if(mode==='play')update(dt);if(mode==='over'){for(const p of sparks){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}sparks=sparks.filter(p=>p.life>0)}render();if(mode==='play'||mode==='over'||mode==='title')raf=requestAnimationFrame(loop)}function pressStart(e){if(mode!=='play')return;e.preventDefault();down=true}c.addEventListener('pointerdown',pressStart);addEventListener('pointerup',()=>down=false);addEventListener('pointercancel',()=>down=false);addEventListener('blur',()=>down=false);document.addEventListener('visibilitychange',()=>{if(document.hidden){down=false;if(audio)audio.suspend()}else if(audio&&mode==='play'&&soundOn)audio.resume()});overlay.addEventListener('pointerdown',()=>{if(mode==='title'&&soundOn&&(!audio||audio.state!=='running')){audioInit();setTimeout(()=>{if(mode==='title')titleMusicStart()},60)}},{passive:true});
title();clock=0;render();raf=requestAnimationFrame(loop);})();
</script></body></html>
